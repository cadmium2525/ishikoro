<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f3d9a8" />
    <title>いしころ</title>
    <style>
      :root {
        --ink: #4a3a2a;
        --paper: rgba(255, 248, 236, 0.86);
        --warm: #e8a35a;
        --danger: #d9573b;
      }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f3d9a8;
        color: var(--ink);
        font-family: "Hiragino Maru Gothic ProN", "Kosugi Maru", "M PLUS Rounded 1c", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }
      canvas#game { display: block; width: 100vw; height: 100dvh; touch-action: none; }

      .hud { position: fixed; pointer-events: none; }
      #status {
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        padding: 6px 14px;
        border-radius: 999px;
        background: var(--paper);
        font-size: 14px;
        white-space: nowrap;
      }
      #status b { font-size: 16px; }

      #power {
        right: max(16px, env(safe-area-inset-right));
        top: 50%;
        transform: translateY(-50%);
        width: 14px;
        height: 38vh;
        border-radius: 8px;
        background: var(--paper);
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.15s;
      }
      #power.on { opacity: 1; }
      #power .danger {
        position: absolute; left: 0; right: 0; top: 0; height: 18%;
        background: repeating-linear-gradient(45deg, rgba(217,87,59,.25) 0 4px, transparent 4px 8px);
      }
      #power .fill {
        position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
        background: var(--warm);
      }
      #power.over .fill { background: var(--danger); }

      #spin {
        right: max(8px, env(safe-area-inset-right));
        top: calc(50% + 19vh + 14px);
        width: 30px; height: 30px;
        border-radius: 50%;
        background: #9c9286;
        border: 2px solid var(--paper);
        opacity: 0;
        transition: opacity 0.15s;
      }
      #spin.on { opacity: 1; }
      #spin .dot {
        position: absolute; top: 50%; left: 50%;
        width: 8px; height: 8px; margin: -4px 0 0 -4px;
        border-radius: 50%;
        background: #fff;
      }

      #hint {
        bottom: max(18px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 10px;
        background: var(--paper);
        font-size: 13px;
        line-height: 1.5;
        text-align: center;
        width: max-content;
        max-width: calc(100vw - 48px);
        transition: opacity 0.4s;
      }
      #hint.off { opacity: 0; }

      #overlay {
        position: fixed; inset: 0;
        display: none;
        align-items: flex-end; justify-content: center;
        padding-bottom: max(28px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: linear-gradient(to top, rgba(255, 240, 215, 0.6), transparent 45%);
      }
      #overlay.on { display: flex; }
      #overlay .card {
        padding: 22px 28px;
        border-radius: 16px;
        background: var(--paper);
        text-align: center;
        line-height: 1.7;
      }
      #overlay h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 0.1em; }
      #overlay .small { font-size: 13px; opacity: 0.75; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="status" class="hud">
      <span>いえまで <b id="dist">--</b> m</span>
      <span>けった <b id="kicks">0</b> 回</span>
    </div>
    <div id="power" class="hud"><div class="danger"></div><div class="fill"></div></div>
    <div id="spin" class="hud"><div class="dot"></div></div>
    <div id="hint" class="hud">タップで方向 → 長押しで強さ →<br />左右にずらして回転 → はなして蹴る</div>

    <div id="overlay">
      <div class="card">
        <h1 id="ov-title">ただいま</h1>
        <div id="ov-body"></div>
        <div class="small">タップでもう一度</div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f3d9a8" />
    <meta name="description" content="今日の石を、家まで連れて帰ろう。道ばたの石を蹴って下校する物理アクション。" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="いしころ" />
    <title>いしころ</title>
    <style>
      :root {
        --ink: #4a3a2a;
        --paper: rgba(255, 248, 236, 0.86);
        --warm: #e8a35a;
        --danger: #d9573b;
      }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f3d9a8;
        color: var(--ink);
        font-family: "Hiragino Maru Gothic ProN", "Kosugi Maru", "M PLUS Rounded 1c", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
        overscroll-behavior: none;
      }
      canvas#game { display: block; width: 100vw; height: 100dvh; touch-action: none; }

      .hud { position: fixed; pointer-events: none; }
      #status {
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        padding: 6px 14px;
        border-radius: 999px;
        background: var(--paper);
        font-size: 14px;
        white-space: nowrap;
      }
      #status b { font-size: 16px; }
      #status.off { opacity: 0; }
      #clockwrap.late b { color: var(--danger); }

      #msg {
        top: calc(max(12px, env(safe-area-inset-top)) + 40px);
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(74, 58, 42, 0.78);
        color: #fff8ec;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.2s;
      }
      #msg.on { opacity: 1; }

      #toast {
        top: calc(max(12px, env(safe-area-inset-top)) + 76px);
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100vw - 48px);
        width: max-content;
        padding: 6px 14px;
        border-radius: 10px;
        background: var(--paper);
        font-size: 13px;
        text-align: center;
        opacity: 0;
        transition: opacity 0.5s;
      }
      #toast.on { opacity: 1; }

      /* 画面の縁をやわらかく暗くして、夕方の写真のような温かみを出す */
      #vignette {
        position: fixed; inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(80, 45, 20, 0.28) 100%);
      }
      body[data-sky="evening"] #vignette { background: radial-gradient(ellipse at 50% 40%, rgba(255, 170, 110, 0.06) 40%, rgba(90, 40, 30, 0.36) 100%); }
      body[data-sky="cloudy"] #vignette { background: radial-gradient(ellipse at 50% 45%, transparent 60%, rgba(60, 60, 70, 0.22) 100%); }

      #mute {
        position: fixed;
        z-index: 10;
        top: calc(max(12px, env(safe-area-inset-top)) + 46px);
        right: max(12px, env(safe-area-inset-right));
        width: 34px; height: 34px;
        border-radius: 50%;
        border: none;
        background: var(--paper);
        color: var(--ink);
        font-size: 16px;
        line-height: 34px;
        padding: 0;
        cursor: pointer;
      }
      #mute.off { opacity: 0.55; text-decoration: line-through; }
      #ov-stone { display: none; width: 84px; height: 84px; border-radius: 14px; background: #efe2c8; margin: 2px auto 4px; }
      #ov-stone.on { display: block; }

      #power {
        right: max(16px, env(safe-area-inset-right));
        top: 50%;
        transform: translateY(-50%);
        width: 14px;
        height: 38vh;
        border-radius: 8px;
        background: var(--paper);
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.15s;
      }
      #power.on { opacity: 1; }
      #power .danger {
        position: absolute; left: 0; right: 0; top: 0; height: 18%;
        background: repeating-linear-gradient(45deg, rgba(217,87,59,.25) 0 4px, transparent 4px 8px);
      }
      #power .fill {
        position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
        background: var(--warm);
      }
      #power.over .fill { background: var(--danger); }

      #spin {
        right: max(8px, env(safe-area-inset-right));
        top: calc(50% + 19vh + 14px);
        width: 30px; height: 30px;
        border-radius: 50%;
        background: #9c9286;
        border: 2px solid var(--paper);
        opacity: 0;
        transition: opacity 0.15s;
      }
      #spin.on { opacity: 1; }
      #spin .dot {
        position: absolute; top: 50%; left: 50%;
        width: 8px; height: 8px; margin: -4px 0 0 -4px;
        border-radius: 50%;
        background: #fff;
      }

      #hint {
        bottom: max(18px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 10px;
        background: var(--paper);
        font-size: 13px;
        line-height: 1.5;
        text-align: center;
        width: max-content;
        max-width: calc(100vw - 48px);
        transition: opacity 0.4s;
      }
      #hint.off { opacity: 0; }

      #overlay {
        position: fixed; inset: 0;
        display: none;
        align-items: flex-end; justify-content: center;
        padding-bottom: max(28px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: linear-gradient(to top, rgba(255, 240, 215, 0.6), transparent 45%);
      }
      #overlay.on { display: flex; }
      #overlay .card {
        padding: 22px 28px;
        border-radius: 16px;
        background: var(--paper);
        text-align: center;
        line-height: 1.7;
      }
      #overlay h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 0.1em; }
      #overlay .small { font-size: 13px; opacity: 0.75; }
      /* はじめる・次の日へ：ひと目でわかる大きなボタン */
      #overlay .action {
        display: inline-block;
        margin-top: 12px;
        padding: 12px 40px;
        border-radius: 999px;
        background: #d9783a;
        color: #fffaf0;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 0.15em;
        box-shadow: 0 3px 0 #a9552a, 0 6px 14px rgba(120, 60, 20, 0.25);
        cursor: pointer;
      }
      #overlay.title { background: linear-gradient(to top, rgba(255, 240, 215, 0.55), transparent 50%); }
      @media (orientation: landscape) {
        #overlay.title {
          align-items: center;
          justify-content: flex-end;
          padding-right: max(5vw, env(safe-area-inset-right));
          background: linear-gradient(to left, rgba(255, 240, 215, 0.55), transparent 50%);
        }
      }
      #overlay .day { font-size: 13px; margin: 2px 0 4px; }
      #collection button {
        font: inherit;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(74, 58, 42, 0.25);
        border-radius: 999px;
        padding: 5px 14px;
        margin-top: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      /* コレクションは控えめな文字のリンク。はじめるボタンとははなして置く */
      #ov-collection {
        display: block;
        margin: 18px auto 0;
        padding: 4px 8px;
        font: inherit;
        font-size: 12px;
        color: var(--ink);
        opacity: 0.7;
        background: none;
        border: none;
        text-decoration: underline;
        cursor: pointer;
      }

      #bubble {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 5;
        padding: 6px 12px;
        border-radius: 14px;
        background: #fffaf0;
        color: #b2402c;
        font-weight: bold;
        font-size: 16px;
        white-space: nowrap;
        pointer-events: none;
        box-shadow: 0 2px 8px rgba(60, 30, 10, 0.25);
        opacity: 0;
        transition: opacity 0.2s;
      }
      #bubble::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -8px;
        margin-left: -7px;
        border: 7px solid transparent;
        border-top-color: #fffaf0;
        border-bottom: 0;
      }
      #bubble.on { opacity: 1; animation: shout 0.35s ease-out; }
      @keyframes shout { from { scale: 0.6; } 60% { scale: 1.12; } to { scale: 1; } }

      #collection {
        position: fixed; inset: 0;
        z-index: 20;
        display: none;
        flex-direction: column;
        background: #fff8ec;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        overflow-y: auto;
        touch-action: pan-y;
      }
      #collection.on { display: flex; }
      #collection header { display: flex; align-items: center; justify-content: space-between; }
      #collection h2 { margin: 0; font-size: 18px; letter-spacing: 0.1em; }
      #collection header button { margin: 0; }
      #collection-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 10px;
        margin-top: 14px;
      }
      .stone-card { text-align: center; font-size: 12px; line-height: 1.4; }
      .stone-card img { width: 100%; max-width: 112px; aspect-ratio: 1; border-radius: 12px; background: #efe2c8; }
      .stone-name { font-weight: bold; }
      .stone-meta { opacity: 0.7; font-size: 11px; }
      #collection .empty { opacity: 0.7; }
      #collection .kinds { grid-column: 1 / -1; margin: 0; font-size: 13px; opacity: 0.8; }
      .stone-card.rare .stone-name { color: #b5622c; }
      .stone-card.rare img { box-shadow: 0 0 0 2px #e8a35a; }
      #overlay.title h1 { font-size: 40px; letter-spacing: 0.3em; margin-right: -0.3em; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="vignette"></div>

    <div id="status" class="hud">
      <span>いえまで <b id="dist">--</b> m</span>
      <span>けった <b id="kicks">0</b> 回</span>
      <span id="clockwrap">5時まで <b id="clock">-:--</b></span>
    </div>
    <div id="msg" class="hud"></div>
    <div id="toast" class="hud"></div>
    <div id="bubble"></div>
    <div id="power" class="hud"><div class="danger"></div><div class="fill"></div></div>
    <div id="spin" class="hud"><div class="dot"></div></div>
    <div id="hint" class="hud">タップで方向 → 長押しで強さ →<br />左右にずらして回転 → はなして蹴る</div>

    <div id="overlay">
      <div class="card">
        <h1 id="ov-title">ただいま</h1>
        <img id="ov-stone" alt="今日の石" />
        <div id="ov-body"></div>
        <div id="ov-action" class="action"></div>
        <button id="ov-collection" type="button">持ち帰った石のコレクションを見る</button>
      </div>
    </div>

    <button id="mute" type="button" aria-label="音を消す">♪</button>

    <div id="collection">
      <header>
        <h2>もちかえった いし</h2>
        <button id="collection-close" type="button">とじる</button>
      </header>
      <div id="collection-grid"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
